# VSP CRM — Nginx site configuration for Laravel + Inertia
#
# Install:
#   sudo cp deploy/nginx/app.vspcrm.in.conf /etc/nginx/sites-available/app.vspcrm.in
#   sudo ln -sf /etc/nginx/sites-available/app.vspcrm.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust root path and php-fpm socket if your server differs.

server {
    listen 80;
    server_name app.vspcrm.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.vspcrm.in;

    root /var/www/vsp-task-management/public;
    index index.php;

    server_tokens off;
    client_max_body_size 100M;

    # SSL certificate paths are added by certbot.

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Branded fallback when PHP-FPM is unavailable or times out.
    error_page 502 /errors/gateway.html;
    error_page 504 /errors/gateway.html;

    location = /errors/gateway.html {
        root /var/www/vsp-task-management/public;
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    # Laravel front controller — all dynamic routes (/tasks/8, /admin/employees/3, etc.)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        # Required for heavy Inertia document loads. Without this, Nginx logs:
        # "upstream sent too big header while reading response header from upstream"
        # and returns 502 on browser refresh of pages like /tasks/{id}.
        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 128k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
